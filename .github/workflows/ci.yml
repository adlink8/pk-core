name: governed-ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install audited development dependencies
        run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Governance preflight
        run: python integration/scripts/governance/preflight.py --ci
      - name: Offline collection and tests
        run: |
          python -m pytest --collect-only -q
          python -m pytest -m "not live" -q

  node:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/personal_data_chatgpt/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/personal_data_chatgpt
      - run: npm test
        working-directory: apps/personal_data_chatgpt
