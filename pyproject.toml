[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-knowledge"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
# Product sync (canonical conversation path)
pk-sync = "personal_knowledge.cli:sync"
# Product knowledge units (incremental inspect/prepare/extract/promote)
pk-ku = "personal_knowledge.cli:ku"
# Retired integrated batch (hidden product use — prints migration message / exit 2)
rag-pipeline = "personal_knowledge.cli:pipeline"
rag-search = "personal_knowledge.cli:search"
rag-api = "personal_knowledge.cli:api"
rag-mcp = "personal_knowledge.cli:mcp"
rag-dashboard = "personal_knowledge.cli:dashboard"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

