<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Data Widget Harness</title>
  <style>
    :root {
      color: #17202a;
      background: #f7f8fa;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; }
    main { display: grid; gap: 12px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, select {
      min-height: 34px;
      border: 1px solid #c9d1dc;
      border-radius: 6px;
      padding: 6px 10px;
      background: #fff;
      color: #17202a;
      font: inherit;
    }
    iframe {
      width: 100%;
      min-height: 560px;
      border: 1px solid #dbe1e8;
      border-radius: 8px;
      background: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Widget Harness</h1>
    <div class="toolbar">
      <select id="widget">
        <option value="memory-graph-widget.html">Memory graph</option>
        <option value="relation-review-widget.html">Relation review</option>
        <option value="data-browser-widget.html">Data browser</option>
      </select>
      <button id="load" type="button">Load fixture</button>
    </div>
    <iframe id="frame" title="Widget preview"></iframe>
  </main>
  <script>
    const fixtures = {
      "memory-graph-widget.html": {
        ok: true,
        scope: { subject: "Codex", hops: 1, include_llm: true },
        counts: { nodes: 3, edges: 2, truncated: false },
        nodes: [
          { id: "mem_1", subject: "Codex", memory_type: "tooling", memory_subtype: "agent", summary: "Uses MCP tools for local workflows." },
          { id: "mem_2", subject: "Apps SDK", memory_type: "project", memory_subtype: "integration", summary: "ChatGPT widgets render structured content." },
          { id: "mem_3", subject: "MCP", memory_type: "protocol", memory_subtype: "transport", summary: "HTTP MCP adapter wraps local REST." }
        ],
        edges: [
          { source: "mem_1", target: "mem_2", relation: "related_to", edge_source: "rule", confidence: 1, gate_status: "accepted" },
          { source: "mem_2", target: "mem_3", relation: "supports", edge_source: "llm_judgment", confidence: 0.82, gate_status: "review" }
        ],
        truncated: false
      },
      "relation-review-widget.html": {
        ok: true,
        count: 2,
        items: [
          { candidate_id: "cand_1", source_subject: "Apps SDK", target_subject: "MCP", relation_type: "supports", confidence: 0.82, gate_status: "review", reason: "LLM proposed an edge that needs human review." },
          { candidate_id: "cand_2", source_subject: "Codex", target_subject: "MCP", relation_type: "uses", confidence: 0.76, gate_status: "review", reason: "Evidence was enough to queue but not auto-accept." }
        ],
        truncated: false
      },
      "data-browser-widget.html": {
        ok: true,
        view: "events",
        initialFilters: { query: "Codex", source: "Agent" },
        actions: [
          "data_list_events",
          "data_list_memories",
          "data_list_relations",
          "data_aggregate",
          "data_timeline",
          "data_export_all",
          "data_export_query",
          "data_get_event_by_id",
          "data_get_memory_by_id",
          "data_quality_report"
        ]
      }
    };

    const frame = document.getElementById("frame");
    const widget = document.getElementById("widget");
    const load = document.getElementById("load");

    function sendFixture() {
      const name = widget.value;
      frame.contentWindow.postMessage({
        jsonrpc: "2.0",
        method: "ui/notifications/tool-result",
        params: { structuredContent: fixtures[name], content: [] }
      }, "*");
    }

    function loadWidget() {
      frame.src = widget.value;
    }

    widget.addEventListener("change", loadWidget);
    load.addEventListener("click", sendFixture);
    frame.addEventListener("load", sendFixture);
    loadWidget();
  </script>
</body>
</html>
