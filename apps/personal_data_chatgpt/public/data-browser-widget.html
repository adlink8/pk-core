<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>查询结果</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f6f7f9;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --text: #111827;
      --text-soft: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --radius: 8px;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; min-height: 100vh; }

    .query-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    #view, #query, #limit, #offset {
      min-height: 34px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 6px 10px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    #view { cursor: pointer; }
    #query { flex: 1; min-width: 200px; }
    #limit, #offset { width: 80px; }

    .btn {
      min-height: 34px;
      padding: 6px 16px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--bg-soft); }
    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.55; cursor: default; }

    .toggle {
      font-size: 12px;
      color: var(--text-soft);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
    }
    .toggle:hover { color: var(--accent); }

    .filters {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      align-items: end;
      padding: 12px;
      margin-bottom: 12px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .filters.open { display: flex; }
    .filters label {
      display: grid;
      gap: 4px;
      color: var(--text-soft);
      font-size: 12px;
    }
    .filters select, .filters input {
      min-height: 30px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 4px 8px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      min-width: 120px;
    }

    .status {
      padding: 8px 0;
      color: var(--text-soft);
      font-size: 13px;
    }
    .status.error { color: var(--danger); }

    .surface {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      overflow: hidden;
    }
    .table-wrap { overflow: auto; max-height: 70vh; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th {
      color: var(--text-soft);
      background: var(--bg-soft);
      font-size: 12px;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: #fafbfc; }

    pre {
      margin: 0;
      padding: 14px;
      max-height: 70vh;
      overflow: auto;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      background: var(--bg-soft);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: var(--text-soft);
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      body { padding: 10px; }
      #query { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="query-bar">
    <select id="view" aria-label="视图">
      <option value="events">事件</option>
      <option value="memories">记忆</option>
      <option value="relations">关系</option>
      <option value="aggregate">聚合</option>
      <option value="timeline">时间线</option>
      <option value="quality">质量报告</option>
      <option value="export">导出</option>
      <option value="event">事件详情</option>
      <option value="memory">记忆详情</option>
    </select>
    <input id="query" type="search" placeholder="输入关键词后回车查询…" autocomplete="off">
    <input id="limit" type="number" min="1" max="5000" value="25" title="每页条数">
    <input id="offset" type="number" min="0" value="0" title="偏移量">
    <button id="load" class="btn primary" type="button">查询</button>
    <button id="toggleFilters" class="toggle" type="button">高级筛选 ▾</button>
  </div>

  <div id="filters" class="filters">
    <label>来源
      <select id="source">
        <option value="">全部</option>
        <option value="Agent">Agent</option>
        <option value="Google">Google</option>
        <option value="GPT">GPT</option>
      </select>
    </label>
    <label>服务
      <input id="service" placeholder="ChatGPT, Codex">
    </label>
    <label>类别
      <input id="category" placeholder="programming">
    </label>
    <label>关系状态
      <select id="status">
        <option value="all">全部</option>
        <option value="review">待审核</option>
        <option value="accepted">已接受</option>
        <option value="rejected">已拒绝</option>
      </select>
    </label>
    <label>分组字段
      <select id="groupBy">
        <option value="source">来源</option>
        <option value="month">月份</option>
        <option value="service">服务</option>
        <option value="category">类别</option>
        <option value="memory_type">记忆类型</option>
        <option value="relation_type">关系类型</option>
      </select>
    </label>
    <label>导出格式
      <select id="format">
        <option value="jsonl">JSONL</option>
        <option value="json">JSON</option>
        <option value="csv">CSV</option>
      </select>
    </label>
    <label>包含证据
      <select id="includeEvidence">
        <option value="true">是</option>
        <option value="false">否</option>
      </select>
    </label>
  </div>

  <div id="status" class="status">等待数据。</div>
  <div id="content"></div>

  <script>
    // 保留所有 MCP Apps bridge 契约:
    //   - ui/notifications/tool-result  (接收工具结果)
    //   - ui/notifications/tool-input   (接收工具输入预填)
    //   - tools/call                    (向 bridge 发起调用)
    //   - window.openai.callTool        (ChatGPT 原生 bridge)
    //   - data_list_events / data_quality_report (工具名,测试契约)
    const state = { config: {}, data: null, loading: false, requestId: 1, pending: new Map() };

    const $ = (id) => document.getElementById(id);
    const viewEl = $("view");
    const limitEl = $("limit");
    const offsetEl = $("offset");
    const queryEl = $("query");
    const sourceEl = $("source");
    const serviceEl = $("service");
    const categoryEl = $("category");
    const statusEl = $("status");
    const groupByEl = $("groupBy");
    const formatEl = $("format");
    const includeEvidenceEl = $("includeEvidence");
    const loadEl = $("load");
    const filtersEl = $("filters");
    const toggleEl = $("toggleFilters");
    const statusLineEl = $("status");
    const contentEl = $("content");

    function text(value, fallback = "") {
      return value === undefined || value === null || value === "" ? fallback : String(value);
    }

    function numberValue(input, fallback) {
      const value = Number.parseInt(input.value, 10);
      return Number.isFinite(value) ? value : fallback;
    }

    function commonArgs() {
      return {
        limit: numberValue(limitEl, 25),
        offset: numberValue(offsetEl, 0),
        source: sourceEl.value || undefined,
        service: serviceEl.value || undefined,
        category: categoryEl.value || undefined,
        keyword: queryEl.value.trim() || undefined
      };
    }

    function buildCall() {
      const view = viewEl.value;
      const args = commonArgs();
      if (view === "events") {
        return { name: "data_list_events", args: { ...args, fields: "event_id,source,event_time,title,service,category_v2", order: "desc" } };
      }
      if (view === "memories") {
        return { name: "data_list_memories", args: { limit: args.limit, offset: args.offset, memory_type: undefined, subject_like: args.keyword } };
      }
      if (view === "relations") {
        return { name: "data_list_relations", args: { limit: args.limit, offset: args.offset, subject: args.keyword, status: statusEl.value || "all" } };
      }
      if (view === "aggregate") {
        return { name: "data_aggregate", args: { ...args, group_by: groupByEl.value || "source" } };
      }
      if (view === "timeline") {
        return { name: "data_timeline", args: { ...args, subject: args.keyword, bucket: "month" } };
      }
      if (view === "export") {
        return {
          name: "data_export",
          args: {
            query: args.keyword,
            keyword: args.keyword,
            source: args.source,
            service: args.service,
            category: args.category,
            format: formatEl.value || "jsonl",
            limit: Math.min(args.limit || 500, 5000),
            offset: args.offset || 0,
            fields: "event_id,source,event_time,title,service,category_v2",
            order: "desc"
          }
        };
      }
      if (view === "event") {
        return { name: "data_get_event_by_id", args: { event_id: queryEl.value.trim() } };
      }
      if (view === "memory") {
        return { name: "data_get_memory_by_id", args: { memory_id: queryEl.value.trim(), include_evidence: includeEvidenceEl.value === "true" } };
      }
      return { name: "data_quality_report", args: {} };
    }

    // 视图模式:控制查询栏哪些控件可见、查询框占位符
    const DETAIL_VIEWS = new Set(["event", "memory"]);
    const NO_PAGINATE_VIEWS = new Set(["quality", "event", "memory"]);

    function applyViewMode() {
      const view = viewEl.value;
      const detail = DETAIL_VIEWS.has(view);
      const noPaginate = NO_PAGINATE_VIEWS.has(view);
      limitEl.style.display = noPaginate ? "none" : "";
      offsetEl.style.display = noPaginate ? "none" : "";
      queryEl.placeholder = detail
        ? (view === "event" ? "输入 event_id…" : "输入 memory_id…")
        : "输入关键词后回车查询…";
      toggleEl.style.display = detail ? "none" : "";
      if (detail) filtersEl.classList.remove("open");
      queryEl.value = detail ? "" : queryEl.value;
    }

    // Extract a human-readable error message from any MCP tool result shape.
    // Handles: isError flag, content[].text (TextContent), OpenAI-style error wrapper.
    function normalizeResult(result, toolName) {
      if (!result) return { ok: false, error: "空响应" };
      // Already normalized (our own shape)
      if (typeof result.ok !== "undefined" && (result.ok === true || result.item || result.items || result.rows)) {
        return result.structuredContent || result;
      }
      // MCP isError flag
      if (result.isError) {
        return { ok: false, error: extractText(result.content) || `${toolName} 调用失败` };
      }
      // OpenAI error wrapper: { error: { message } } or { error: "..." }
      if (result.error) {
        const msg = (typeof result.error === "object" && result.error.message) ? result.error.message : String(result.error);
        return { ok: false, error: cleanErrorMessage(msg) };
      }
      // content array without isError (some bridges) -> treat first text as error if it mentions "failed"
      const text = extractText(result.content);
      if (text && /failed|error|required|exception/i.test(text) && !result.structuredContent && !result.items && !result.rows) {
        return { ok: false, error: cleanErrorMessage(text) };
      }
      return result.structuredContent || result;
    }

    function extractText(content) {
      if (!content) return "";
      if (typeof content === "string") return content;
      if (Array.isArray(content)) {
        return content.map((c) => (typeof c === "string" ? c : (c?.text || ""))).join(" ").trim();
      }
      if (content.text) return content.text;
      return "";
    }

    // Turn "Tool data_get_memory_by_id failed: memory_id is required" into
    // "memory_id 是必填项" style readable text, with fallback to original.
    function cleanErrorMessage(msg) {
      if (!msg) return "未知错误";
      // strip "Tool <name> failed: " prefix
      let s = String(msg).replace(/^Tool\s+\S+\s+failed:\s*/i, "");
      // common required-field messages
      const req = s.match(/^(\w+)\s+is\s+required/i);
      if (req) return `${req[1]} 是必填项,请在查询框填写。`;
      return s;
    }

    async function callTool(name, args) {
      let result;
      if (window.openai && typeof window.openai.callTool === "function") {
        result = await window.openai.callTool(name, args);
      } else {
        const id = state.requestId++;
        const payload = { jsonrpc: "2.0", id, method: "tools/call", params: { name, arguments: args } };
        result = await new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => {
            state.pending.delete(id);
            reject(new Error("Bridge tools/call timed out"));
          }, 15000);
          state.pending.set(id, { resolve, reject, timeout });
          window.parent.postMessage(payload, "*");
        });
      }
      return normalizeResult(result, name);
    }

    async function loadData() {
      const view = viewEl.value;
      const { name, args } = buildCall();
      // Detail views require an id in the query box; block empty input instead
      // of sending a request the MCP tool will reject.
      if ((view === "event" && !args.event_id) || (view === "memory" && !args.memory_id)) {
        const idField = view === "event" ? "event_id" : "memory_id";
        statusLineEl.classList.remove("error");
        statusLineEl.textContent = `请输入 ${idField} 后查询。`;
        contentEl.innerHTML = `<div class="surface"><div class="empty">在上方查询框输入 ${idField},然后点"查询"或回车。</div></div>`;
        return;
      }
      state.loading = true;
      renderLoading(name);
      try {
        const data = await callTool(name, args);
        setData(data, name);
      } catch (error) {
        setData({ ok: false, error: error instanceof Error ? error.message : String(error) }, name);
      } finally {
        state.loading = false;
        if (window.openai && typeof window.openai.setWidgetState === "function") {
          window.openai.setWidgetState({ view: viewEl.value, query: queryEl.value, source: sourceEl.value });
        }
      }
    }

    function setConfig(config) {
      state.config = config || {};
      if (state.config.view) {
        viewEl.value = state.config.view;
        applyViewMode();
      }
      const filters = state.config.initialFilters || {};
      if (filters.query) queryEl.value = filters.query;
      if (filters.source) sourceEl.value = filters.source;
      if (filters.service) serviceEl.value = filters.service;
      if (filters.category) categoryEl.value = filters.category;
      loadData();
    }

    function setData(data, toolName) {
      state.data = data || {};
      render(toolName);
    }

    function renderLoading(toolName) {
      loadEl.disabled = true;
      statusLineEl.classList.remove("error");
      statusLineEl.innerHTML = `<span class="spinner"></span>正在调用 ${toolName}…`;
      contentEl.innerHTML = "";
    }

    // 详情视图(data_get_*_by_id)返回单个对象,渲染成键值对而不是表
    function renderDetail(data) {
      const item = data.item || data;
      const entries = Object.entries(item).map(([key, value]) =>
        `<tr><th>${escapeHtml(key)}</th><td>${escapeHtml(formatCell(value))}</td></tr>`
      ).join("");
      contentEl.innerHTML = `<div class="surface"><div class="table-wrap"><table><tbody>${entries}</tbody></table></div></div>`;
    }

    function render(toolName) {
      loadEl.disabled = false;
      const data = state.data;
      if (!data) {
        statusLineEl.textContent = "暂无数据。";
        contentEl.innerHTML = "";
        return;
      }
      if (data.ok === false) {
        statusLineEl.classList.add("error");
        statusLineEl.textContent = `${toolName || "工具"} 调用失败。`;
        const errText = escapeHtml(data.error || "未知错误");
        contentEl.innerHTML = `<div class="surface"><pre style="color:#dc2626">${errText}</pre></div>`;
        return;
      }
      statusLineEl.classList.remove("error");
      // 详情视图(data_get_event_by_id / data_get_memory_by_id):单对象 → 键值表
      if (DETAIL_VIEWS.has(viewEl.value)) {
        const found = data.found !== false;
        statusLineEl.textContent = found
          ? `${toolName || "工具"}:已找到记录。`
          : `${toolName || "工具"}:未找到该 id。`;
        if (!found) {
          contentEl.innerHTML = `<div class="surface"><div class="empty">未找到 id 为 ${escapeHtml(queryEl.value)} 的记录。</div></div>`;
          return;
        }
        renderDetail(data);
        return;
      }
      const rows = rowsFor(data);
      const total = data.total ?? data.counts?.total ?? rows.length;
      const returned = data.count ?? data.counts?.returned ?? rows.length;
      statusLineEl.textContent = `${toolName || "工具"}:返回 ${returned} 条,共 ${total} 条。`;
      if (typeof data.text === "string" && data.text.length) {
        contentEl.innerHTML = `<div class="surface"><pre>${escapeHtml(data.text.slice(0, 20000))}</pre></div>`;
        return;
      }
      if (!rows.length) {
        contentEl.innerHTML = `<div class="surface"><pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre></div>`;
        return;
      }
      renderTable(rows);
    }

    function rowsFor(data) {
      if (Array.isArray(data.items)) return data.items;
      if (Array.isArray(data.rows)) return data.rows;
      if (data.events || data.memories || data.relations || data.judgments) {
        return [
          { area: "events", ...flatten(data.events || {}) },
          { area: "memories", ...flatten(data.memories || {}) },
          { area: "relations", ...flatten(data.relations || {}) },
          { area: "judgments", ...flatten(data.judgments || {}) }
        ];
      }
      return [];
    }

    function flatten(value) {
      const out = {};
      for (const [key, item] of Object.entries(value || {})) {
        out[key] = typeof item === "object" && item !== null ? JSON.stringify(item) : item;
      }
      return out;
    }

    function renderTable(rows) {
      const columns = [...new Set(rows.flatMap((row) => Object.keys(row)))].slice(0, 12);
      const body = rows.map((row) =>
        `<tr>${columns.map((column) => `<td>${escapeHtml(formatCell(row[column]))}</td>`).join("")}</tr>`
      ).join("");
      contentEl.innerHTML = `<div class="surface"><div class="table-wrap"><table><thead><tr>${columns.map((column) => `<th>${escapeHtml(column)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div></div>`;
    }

    function formatCell(value) {
      if (value === undefined || value === null) return "";
      if (typeof value === "object") return JSON.stringify(value);
      return String(value);
    }

    function escapeHtml(value) {
      return text(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function handleToolResult(payload) {
      const structured = payload && (payload.structuredContent || payload.params && payload.params.structuredContent);
      if (!structured) return;
      if (structured.actions && structured.view) setConfig(structured);
      else setData(structured, "tool-result");
    }

    window.addEventListener("message", (event) => {
      const message = event.data || {};
      if (message.jsonrpc === "2.0" && state.pending.has(message.id)) {
        const pending = state.pending.get(message.id);
        window.clearTimeout(pending.timeout);
        state.pending.delete(message.id);
        if (message.error) pending.reject(new Error(message.error.message || "Bridge tools/call failed"));
        else pending.resolve(message.result && (message.result.structuredContent || message.result));
        return;
      }
      if (message.method === "ui/notifications/tool-result") {
        handleToolResult(message.params || {});
      }
      if (message.method === "ui/notifications/tool-input" && message.params) {
        setConfig({ ...(state.config || {}), ...(message.params.structuredContent || message.params) });
      }
      if (message.type === "fixture") {
        setConfig(message.structuredContent || message.data);
      }
    });

    loadEl.addEventListener("click", loadData);
    queryEl.addEventListener("keydown", (e) => { if (e.key === "Enter") loadData(); });
    viewEl.addEventListener("change", () => { offsetEl.value = "0"; applyViewMode(); loadData(); });
    toggleEl.addEventListener("click", () => {
      const open = filtersEl.classList.toggle("open");
      toggleEl.textContent = open ? "高级筛选 ▴" : "高级筛选 ▾";
    });

    if (window.openai && window.openai.toolOutput) setConfig(window.openai.toolOutput);
    else { applyViewMode(); render(); }
  </script>
</body>
</html>
