<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relation Review Queue</title>
  <style>
    :root {
      color: #17202a;
      background: #f7f8fa;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; }
    main { display: grid; gap: 12px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .summary { color: #516070; font-size: 13px; margin-top: 4px; }
    label { display: grid; gap: 4px; color: #516070; font-size: 12px; }
    select, input {
      min-height: 32px;
      border: 1px solid #c9d1dc;
      border-radius: 6px;
      padding: 5px 8px;
      background: #fff;
      color: #17202a;
      font: inherit;
    }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .table-wrap {
      overflow: auto;
      border: 1px solid #dbe1e8;
      border-radius: 8px;
      background: #fff;
    }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid #edf1f5; text-align: left; vertical-align: top; font-size: 13px; }
    th { color: #516070; background: #fbfcfe; font-size: 12px; font-weight: 700; position: sticky; top: 0; }
    tr:last-child td { border-bottom: 0; }
    .reason { max-width: 360px; overflow-wrap: anywhere; }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
      background: #eef3f8;
      color: #3b4b5e;
    }
    .badge.review { background: #fff1dc; color: #855400; }
    .badge.accepted { background: #e8f5ee; color: #17663b; }
    .badge.rejected { background: #fdecec; color: #9a2b2b; }
    .empty {
      padding: 28px;
      text-align: center;
      color: #647386;
      border: 1px dashed #c9d1dc;
      border-radius: 8px;
      background: #fff;
    }
    @media (max-width: 720px) {
      body { padding: 10px; }
      .controls { width: 100%; }
      label, select, input { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Relation Review Queue</h1>
        <div id="summary" class="summary">Waiting for tool result.</div>
      </div>
      <div class="controls">
        <label>Status
          <select id="statusFilter"><option value="">All statuses</option></select>
        </label>
        <label>Subject
          <input id="subjectFilter" placeholder="Filter source or target">
        </label>
      </div>
    </header>
    <section id="content"></section>
  </main>

  <script>
    const state = { data: null };
    const contentEl = document.getElementById("content");
    const summaryEl = document.getElementById("summary");
    const statusFilter = document.getElementById("statusFilter");
    const subjectFilter = document.getElementById("subjectFilter");

    function asArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function text(value, fallback = "") {
      return value === undefined || value === null || value === "" ? fallback : String(value);
    }

    function itemStatus(item) {
      return text(item.gate_status || item.status, "review");
    }

    function setData(data) {
      state.data = data || {};
      const statuses = [...new Set(asArray(state.data.items).map(itemStatus))].sort();
      statusFilter.innerHTML = '<option value="">All statuses</option>' + statuses.map((status) => `<option value="${escapeAttr(status)}">${escapeHtml(status)}</option>`).join("");
      render();
    }

    function filteredItems() {
      const status = statusFilter.value;
      const subjectNeedle = subjectFilter.value.trim().toLowerCase();
      return asArray(state.data && state.data.items).filter((item) => {
        if (status && itemStatus(item) !== status) return false;
        if (subjectNeedle) {
          const haystack = `${text(item.source_subject)} ${text(item.target_subject)} ${text(item.subject)}`.toLowerCase();
          if (!haystack.includes(subjectNeedle)) return false;
        }
        return true;
      });
    }

    function render() {
      const data = state.data;
      if (!data) {
        contentEl.innerHTML = '<div class="empty">No review data loaded.</div>';
        return;
      }
      if (data.ok === false) {
        summaryEl.textContent = "Tool returned an error.";
        contentEl.innerHTML = `<div class="empty">Review queue unavailable: ${escapeHtml(data.error || "unknown error")}</div>`;
        return;
      }
      const items = filteredItems();
      summaryEl.textContent = `${items.length} visible item(s). Total: ${text(data.count, asArray(data.items).length)} item(s). First version is read-only.`;
      if (!items.length) {
        contentEl.innerHTML = '<div class="empty">No review items match the current filters.</div>';
        return;
      }
      contentEl.innerHTML = `<div class="table-wrap"><table>
        <thead>
          <tr>
            <th>Candidate</th>
            <th>Source</th>
            <th>Target</th>
            <th>Relation</th>
            <th>Confidence</th>
            <th>Status</th>
            <th>Reason</th>
          </tr>
        </thead>
        <tbody>${items.map(rowHtml).join("")}</tbody>
      </table></div>`;
    }

    function rowHtml(item) {
      const status = itemStatus(item);
      return `<tr>
        <td>${escapeHtml(text(item.candidate_id || item.id, "-"))}</td>
        <td>${escapeHtml(text(item.source_subject || item.source, "-"))}</td>
        <td>${escapeHtml(text(item.target_subject || item.target, "-"))}</td>
        <td>${escapeHtml(text(item.relation_type || item.relation, "-"))}</td>
        <td>${escapeHtml(text(item.confidence, "-"))}</td>
        <td><span class="badge ${escapeAttr(status)}">${escapeHtml(status)}</span></td>
        <td class="reason">${escapeHtml(text(item.reason || item.explanation || item.evidence, "-"))}</td>
      </tr>`;
    }

    function escapeHtml(value) {
      return text(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function handleToolResult(payload) {
      const structured = payload && (payload.structuredContent || payload.params && payload.params.structuredContent);
      if (structured) setData(structured);
    }

    window.addEventListener("message", (event) => {
      const message = event.data || {};
      if (message.method === "ui/notifications/tool-result") {
        handleToolResult(message.params || {});
      }
      if (message.type === "fixture") {
        setData(message.structuredContent || message.data);
      }
    });

    [statusFilter, subjectFilter].forEach((control) => control.addEventListener("input", render));
    if (window.__MCP_WIDGET_FIXTURE__) setData(window.__MCP_WIDGET_FIXTURE__);
    render();
  </script>
</body>
</html>
